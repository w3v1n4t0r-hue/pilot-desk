name: PilotDesk QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          find assets api qa -name '*.js' -o -name '*.mjs' | while read file; do node --check "$file"; done
      - name: Run PilotDesk smoke checks
        run: node qa/smoke.mjs
