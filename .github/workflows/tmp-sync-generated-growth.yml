name: Temporary sync generated growth assets

on:
  push:
    branches: [growth-link-magnets-2026-09-18]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth-link-magnets-2026-09-18
          fetch-depth: 0
      - run: node scripts/generate-calculator-pages.mjs
      - run: node scripts/postprocess-site.mjs
      - run: node scripts/strengthen-guides.mjs
      - run: node scripts/normalize-guide-schema.mjs
      - run: node scripts/normalize-public-copy.mjs
      - name: Restore hand-edited aviation pages
        shell: bash
        run: |
          git restore --source=HEAD -- \
            calculators/glide-range/index.html \
            calculators/crosswind/index.html \
            calculators/density-altitude/index.html \
            calculators/pivotal-altitude/index.html \
            calculators/three-degree-descent/index.html \
            flight-training.html \
            guides/glide-range.html \
            guides/how-far-can-an-airplane-glide.html \
            guides/best-glide-speed-vs-glide-ratio.html \
            guides/emergency-glide-planning.html \
            guides/crosswind-component.html \
            guides/density-altitude.html \
            guides/pivotal-altitude.html \
            guides/three-degree-descent.html \
            guides/checkride-study-guides.html \
            guides/pilot-checkride-math.html \
            guides/pilot-math-formulas.html \
            guides/pilot-math-cheat-sheet.html \
            guides/isa-temperature.html \
            guides/types-of-altitude.html \
            guides/multiengine-checkride-study-guide.html \
            guides/critical-engine-multiengine.html \
            guides/multiengine-vmc-factors.html \
            guides/vmc-vs-vyse.html \
            guides/accelerate-stop-accelerate-go.html \
            guides/feathering-vs-windmilling-propeller.html \
            guides/identify-verify-feather.html \
            guides/past-critical-engine.html \
            guides/single-engine-climb-performance.html \
            guides/single-engine-service-ceiling.html \
            guides/vmc-demonstration-explained.html \
            guides/zero-sideslip-multiengine.html \
            guides/avgas-weight-per-gallon.html \
            guides/cessna-172-glide-distance.html \
            guides/crosswind-component-chart.html \
            guides/seminole-vmc-study.html \
            guides/three-degree-descent-rate-chart.html
      - run: node scripts/clean-guide-boilerplate.mjs
      - run: node scripts/generate-sitemap.mjs
      - name: Commit canonical generated output
        run: |
          if git diff --quiet; then
            echo "Generated output already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "Sync generated sitemap for growth references"
          git push origin HEAD:growth-link-magnets-2026-09-18
