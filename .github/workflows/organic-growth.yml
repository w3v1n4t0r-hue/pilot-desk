name: PilotDesk Organic Growth QA

on:
  push:
    branches: [organic-growth-pack]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: organic-growth-pack
      - name: Apply growth patch
        run: python scripts/apply-organic-growth.py
      - name: Check JavaScript syntax
        run: find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run full QA
        run: |
          node qa/smoke.mjs
          node qa/qol-smoke.mjs
          node qa/product-polish-smoke.mjs
          node qa/v2-smoke.mjs
          node qa/planner-lab-tests.mjs
          node qa/formula-tests.mjs
          node qa/site-integrity.mjs
          node qa/copy-tone.mjs
          node qa/google-audit.mjs
      - name: Commit tested growth changes
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add index.html sitemap.xml qa/qol-smoke.mjs
          git commit -m "Add flight training discovery and trust cues"
          git push origin HEAD:organic-growth-pack
