name: QA product upgrade

on:
  push:
    branches:
      - product/full-site-upgrade-2026-09-11

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check JavaScript
        run: |
          node --check assets/boot.js
          node --check assets/growth-suite.js
          node --check assets/flight-workspace.js
          node --check assets/product-nav.js
          node --check scripts/apply-product-upgrades.mjs
          node --check scripts/postprocess-logo.mjs
      - name: Verify product upgrade output
        run: |
          grep -q '/assets/boot.js' index.html
          grep -q 'id="pdPopularNow"' index.html
          grep -q 'flight-planning-workspace.html' sitemap.xml
          grep -q 'social-e6b.svg' e6b-flight-computer.html
          grep -q 'social-crosswind.svg' calculators/crosswind/index.html
          grep -q 'social-density-altitude.svg' calculators/density-altitude/index.html
          grep -q 'assets/icon.svg' calculators/crosswind/index.html
          grep -q 'workspaceCalculate' flight-planning-workspace.html
