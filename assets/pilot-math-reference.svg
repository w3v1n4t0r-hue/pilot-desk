<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">PilotDesk aviation math reference</title><desc id="desc">A dark aviation reference graphic showing pilot math formulas for wind, altitude, climb, descent, turns, fuel, and weight and balance.</desc><rect width="1200" height="675" fill="#08090b"/><rect x="56" y="52" width="1088" height="571" rx="28" fill="#111317" stroke="#34383f" stroke-width="2"/><g fill="#d9dde2" font-family="Arial,Helvetica,sans-serif"><text x="96" y="132" font-size="32" font-weight="700">PilotDesk</text><text x="96" y="181" font-size="54" font-weight="700">Pilot Math &amp; Aviation Reference</text><text x="96" y="225" font-size="24" fill="#9da2aa">Wind • altitude • climb • descent • turns • fuel • weight &amp; balance</text></g><g font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#d9dde2"><rect x="96" y="278" width="475" height="110" rx="18" fill="#171a1f" stroke="#34383f"/><text x="126" y="323">Crosswind = V × sin(θ)</text><text x="126" y="360" fill="#a3a7ae" font-size="21">Resolve wind relative to runway/course</text><rect x="629" y="278" width="475" height="110" rx="18" fill="#171a1f" stroke="#34383f"/><text x="659" y="323">PA ≈ Elev + (29.92 − P) × 1000</text><text x="659" y="360" fill="#a3a7ae" font-size="21">Pressure altitude quick estimate</text><rect x="96" y="414" width="475" height="110" rx="18" fill="#171a1f" stroke="#34383f"/><text x="126" y="459">FPM = ft/NM × NM/min</text><text x="126" y="496" fill="#a3a7ae" font-size="21">Climb and descent planning</text><rect x="629" y="414" width="475" height="110" rx="18" fill="#171a1f" stroke="#34383f"/><text x="659" y="459">CG = Total Moment ÷ Total Weight</text><text x="659" y="496" fill="#a3a7ae" font-size="21">Weight and balance math</text></g><text x="96" y="582" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#858a92">Training and planning reference • Verify operational numbers with current approved sources</text></svg>
