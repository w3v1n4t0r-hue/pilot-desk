name: Production build and core flows
on:
  push:
    branches: [main, fix/core-release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npx --yes pnpm@10.32.1 install --frozen-lockfile
      - name: Account flow regressions
        run: node qa/account-flow.mjs
      - name: Formula and navigation regressions
        run: node qa/formula-tests.mjs && node qa/product-experience.mjs
      - name: Production build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Links and SEO
        run: node qa/site-integrity.mjs && node qa/seo-hardening.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/pilotdesk-browser --no-package-lock playwright@1.62.1
          /tmp/pilotdesk-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Responsive browser and interaction checks
        env:
          PD_PLAYWRIGHT_MODULE: /tmp/pilotdesk-browser/node_modules/playwright/index.mjs
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/pilotdesk-http.log 2>&1 &
          node qa/browser-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: qa-output/
