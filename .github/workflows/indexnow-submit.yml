name: Submit PilotDesk to IndexNow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sitemap.xml
      - index.html
      - guides.html
      - guides/**
      - calculators/**
      - flight-training.html
      - metar-decoder.html
      - airport.html
      - weather.html
      - planner.html
      - route-planner.html
      - procedures.html
      - about.html
      - sources.html
      - scripts/submit-indexnow.py
      - c731d63e44f2d52fcd122041601cfb22.txt
      - .github/workflows/indexnow-submit.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IndexNow payload
        run: python scripts/submit-indexnow.py
      - name: Verify key is live
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL https://www.pilot-desk.com/c731d63e44f2d52fcd122041601cfb22.txt || true)
            if [ "$body" = "c731d63e44f2d52fcd122041601cfb22" ]; then
              echo "IndexNow key is live"
              exit 0
            fi
            sleep 10
          done
          echo "IndexNow key file is not live yet"
          exit 1
      - name: Submit canonical URLs
        run: |
          code=$(curl -sS -o indexnow-response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json \
            https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP status: $code"
          cat indexnow-response.txt || true
          case "$code" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
