name: PilotDesk Charset Live Debug

on:
  push:
    branches: [charset-live-debug]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production response
        run: |
          set -euxo pipefail
          curl -sS -D /tmp/h1 -o /tmp/b1 https://pilot-desk.com/
          curl -sS -D /tmp/h2 -o /tmp/b2 https://www.pilot-desk.com/
          echo '=== bare domain headers ==='
          cat /tmp/h1
          echo '=== www headers ==='
          cat /tmp/h2
          python - <<'PY'
          from pathlib import Path
          for f in ['/tmp/b1','/tmp/b2']:
              b=Path(f).read_bytes()
              lo=b[:1024].lower()
              print(f, 'len=',len(b),'charset=',b'charset' in lo,'meta=',b'<meta charset=' in lo)
          PY
      - name: Run Lighthouse charset audit on both URLs
        run: |
          npx --yes lighthouse https://www.pilot-desk.com/ --only-categories=best-practices --output=json --output-path=/tmp/www.json --chrome-flags='--headless --no-sandbox --disable-gpu' || true
          npx --yes lighthouse https://pilot-desk.com/ --only-categories=best-practices --output=json --output-path=/tmp/bare.json --chrome-flags='--headless --no-sandbox --disable-gpu' || true
          node - <<'NODE'
          const fs=require('fs');
          for(const [name,path] of [['www','/tmp/www.json'],['bare','/tmp/bare.json']]){
            if(!fs.existsSync(path)){console.log(name,'no report');continue}
            const r=JSON.parse(fs.readFileSync(path,'utf8'));
            const a=r.audits.charset;
            console.log(name,'finalUrl=',r.finalUrl,'score=',a?.score,'error=',a?.errorMessage||'', 'display=',a?.displayValue||'');
          }
          NODE
