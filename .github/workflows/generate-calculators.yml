name: Generate calculator and guide pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-calculator-pages.mjs'
      - 'scripts/strengthen-guides.mjs'
      - 'scripts/postprocess-site.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'assets/calculator-config.js'
      - '.github/workflows/generate-calculators.yml'

permissions:
  contents: write

concurrency:
  group: pilotdesk-seo-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'PilotDesk Automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate static calculator pages
        run: node scripts/generate-calculator-pages.mjs
      - name: Apply static branding and aviation FAQ content
        run: node scripts/postprocess-site.mjs
      - name: Deepen guides and core tool pages
        run: node scripts/strengthen-guides.mjs
      - name: Generate canonical sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Check JavaScript syntax
        run: |
          find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run PilotDesk smoke checks
        run: node qa/smoke.mjs
      - name: Run QoL smoke checks
        run: node qa/qol-smoke.mjs
      - name: Run product polish checks
        run: node qa/product-polish-smoke.mjs
      - name: Run app bootstrap checks
        run: node qa/app-bootstrap-smoke.mjs
      - name: Run PilotDesk v2 master checks
        run: node qa/v2-smoke.mjs
      - name: Run planner lab checks
        run: node qa/planner-lab-tests.mjs
      - name: Run calculator formula regression tests
        run: node qa/formula-tests.mjs
      - name: Run site integrity checks
        run: node qa/site-integrity.mjs
      - name: Check public copy tone
        run: node qa/copy-tone.mjs
      - name: Check Google audit regressions
        run: node qa/google-audit.mjs
      - name: Run SEO hardening checks
        run: node qa/seo-hardening.mjs
      - name: Commit generated pages
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated pages already current."
          else
            git commit -m "Refresh sitewide SEO content"
            git push
          fi
