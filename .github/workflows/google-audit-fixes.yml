name: PilotDesk Google Audit Fixes

on:
  push:
    branches: [google-audit-fixes]
    paths:
      - '.github/RUN_GOOGLE_AUDIT'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-audit-fixes
      - name: Apply Lighthouse fixes
        run: python scripts/apply-google-audit-fixes.py
      - name: Check JavaScript syntax
        run: find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run full QA
        run: |
          node qa/smoke.mjs
          node qa/qol-smoke.mjs
          node qa/product-polish-smoke.mjs
          node qa/v2-smoke.mjs
          node qa/planner-lab-tests.mjs
          node qa/formula-tests.mjs
          node qa/site-integrity.mjs
          node qa/copy-tone.mjs
          node qa/google-audit.mjs
      - name: Commit tested fixes
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add -A
          git reset HEAD .github/workflows/google-audit-fixes.yml .github/RUN_GOOGLE_AUDIT scripts/apply-google-audit-fixes.py || true
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Fix Lighthouse performance accessibility and security findings"
            git push origin HEAD:google-audit-fixes
          fi
