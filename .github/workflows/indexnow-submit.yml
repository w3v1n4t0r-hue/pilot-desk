name: Submit PilotDesk to IndexNow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap*.xml'
      - robots.txt
      - assets/app-bootstrap.js
      - assets/seo.js
      - assets/product-polish.js
      - assets/runtime-qol.js
      - assets/tool-first-layout.js
      - assets/professional-polish.css
      - assets/performance.css
      - assets/performance.js
      - assets/growth-suite.js
      - assets/share-enhance.js
      - assets/analytics.js
      - scripts/submit-indexnow.py
      - scripts/prepare-astro-public.mjs
      - c731d63e44f2d52fcd122041601cfb22.txt
      - .github/workflows/indexnow-submit.yml
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read
  statuses: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute searchable-content signature
        id: signature
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import hashlib
          files=[]
          files.extend(p for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          files.extend(Path('.').glob('sitemap*.xml'))
          for name in [
              'robots.txt','assets/app-bootstrap.js','assets/seo.js','assets/product-polish.js',
              'assets/runtime-qol.js','assets/tool-first-layout.js','assets/professional-polish.css',
              'assets/performance.css','assets/performance.js','assets/growth-suite.js',
              'assets/share-enhance.js','assets/analytics.js'
          ]:
              p=Path(name)
              if p.exists(): files.append(p)
          h=hashlib.sha256()
          for p in sorted(set(files),key=lambda x:x.as_posix()):
              h.update(p.as_posix().encode());h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          print('value='+h.hexdigest())
          PY

      - name: Restore IndexNow submission marker
        id: submitted
        uses: actions/cache@v6
        with:
          path: .indexnow-submitted
          key: indexnow-${{ steps.signature.outputs.value }}

      - name: Check production readiness
        id: deploy
        if: steps.submitted.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "payload_mode=local" >> "$GITHUB_OUTPUT"

          probe_live() {
            key_body=$(curl -fsSL --max-time 15 https://www.pilot-desk.com/c731d63e44f2d52fcd122041601cfb22.txt || true)
            sitemap_body=$(curl -fsSL --max-time 15 https://www.pilot-desk.com/sitemap.xml || true)
            [ "$key_body" = "c731d63e44f2d52fcd122041601cfb22" ] && echo "$sitemap_body" | grep -q "<urlset"
          }

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            if probe_live; then
              echo "Production key and sitemap are live; using deployed sitemaps."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "payload_mode=live" >> "$GITHUB_OUTPUT"
            else
              echo "Production could not be verified; skipping IndexNow safely."
            fi
            exit 0
          fi

          for i in $(seq 1 20); do
            state=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" | python -c "import json,sys; d=json.load(sys.stdin); s=[x.get('state') for x in d.get('statuses',[]) if x.get('context')=='Vercel']; print(s[0] if s else 'pending')" || echo pending)
            echo "Vercel production status: $state"
            if [ "$state" = "success" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "payload_mode=local" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
              if echo "$changed" | grep -Evq '^(\.github/workflows/indexnow-submit\.yml|scripts/submit-indexnow\.py|robots\.txt)$'; then
                echo "Vercel did not publish content changes; skipping unpublished URLs."
                exit 0
              fi
              if probe_live; then
                echo "SEO-infrastructure-only change; submitting the currently deployed site."
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "payload_mode=live" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep 15
          done
          echo "Vercel production status is still pending; skipping IndexNow for this run."

      - name: Skip unchanged content
        if: steps.submitted.outputs.cache-hit == 'true' && github.event_name != 'workflow_dispatch'
        run: echo "This searchable-content version was already submitted to IndexNow."

      - name: Skip unpublished content
        if: (steps.submitted.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && steps.deploy.outputs.ready != 'true'
        run: echo "Searchable content was not confirmed live, so IndexNow submission is intentionally skipped."

      - name: Build IndexNow payload
        if: (steps.submitted.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && steps.deploy.outputs.ready == 'true'
        shell: bash
        run: |
          if [ "${{ steps.deploy.outputs.payload_mode }}" = "live" ]; then
            python scripts/submit-indexnow.py --live
          else
            python scripts/submit-indexnow.py
          fi

      - name: Verify key is live
        if: (steps.submitted.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && steps.deploy.outputs.ready == 'true'
        shell: bash
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsSL --max-time 15 https://www.pilot-desk.com/c731d63e44f2d52fcd122041601cfb22.txt || true)
            if [ "$body" = "c731d63e44f2d52fcd122041601cfb22" ]; then echo "IndexNow key is live"; exit 0; fi
            sleep 15
          done
          echo "IndexNow key file is not live yet"; exit 1

      - name: Submit canonical URLs
        if: (steps.submitted.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch') && steps.deploy.outputs.ready == 'true'
        shell: bash
        run: |
          code=$(curl -sS -o indexnow-response.txt -w "%{http_code}" -X POST -H "Content-Type: application/json; charset=utf-8" --data-binary @indexnow-payload.json https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP status: $code"
          cat indexnow-response.txt || true
          case "$code" in 200|202) ;; *) exit 1 ;; esac
          mkdir -p .indexnow-submitted
          printf '%s\n' '${{ steps.signature.outputs.value }}' > .indexnow-submitted/signature
