name: Generate calculator pages

on:
  push:
    branches: [main]
    paths:
      - 'assets/calculator-config.js'
      - 'scripts/generate-calculator-pages.mjs'
      - '.github/workflows/generate-calculators.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate static calculator pages
        run: node scripts/generate-calculator-pages.mjs
      - name: Commit generated pages
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add calculators
          if git diff --cached --quiet; then
            echo "Calculator pages already current."
          else
            git commit -m "Generate complete static calculator pages"
            git push
          fi
