name: Apply live audit polish

on:
  push:
    branches: [fix/live-audit-polish-all-pages]
    paths:
      - 'scripts/live-audit-polish.mjs'
      - '.github/workflows/live-audit-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-audit-polish-all-pages
          fetch-depth: 0
      - name: Apply live audit findings
        run: node scripts/live-audit-polish.mjs
      - name: Rebuild canonical sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Check JavaScript syntax
        run: find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run formula regressions
        run: node qa/formula-tests.mjs
      - name: Run site integrity
        run: node qa/site-integrity.mjs
      - name: Run copy tone
        run: node qa/copy-tone.mjs
      - name: Run Google audit regressions
        run: node qa/google-audit.mjs
      - name: Run SEO hardening
        run: node qa/seo-hardening.mjs
      - name: Commit polished output to branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'PilotDesk QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply full live-page audit fixes'
          git push origin HEAD:fix/live-audit-polish-all-pages
