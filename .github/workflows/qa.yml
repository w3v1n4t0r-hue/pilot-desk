name: PilotDesk QA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'CITATION.cff'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: pilotdesk-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Astro migration output
        run: npm run build
      - name: Check Astro migration
        run: node qa/astro-migration.mjs
      - name: Check JavaScript syntax
        run: |
          find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run PilotDesk smoke checks
        run: node qa/smoke.mjs
      - name: Run QoL smoke checks
        run: node qa/qol-smoke.mjs
      - name: Run product polish checks
        run: node qa/product-polish-smoke.mjs
      - name: Run app bootstrap checks
        run: node qa/app-bootstrap-smoke.mjs
      - name: Run professional visual polish checks
        run: node qa/professional-polish-smoke.mjs
      - name: Run unified UI checks
        run: node qa/unified-ui-smoke.mjs
      - name: Run site chassis checks
        run: node qa/site-chassis-smoke.mjs
      - name: Run Claude Step 1 homepage and navigation checks
        run: node qa/claude-step1-home-nav-smoke.mjs
      - name: Run Claude Step 2 calculator checks
        run: node qa/claude-step2-calculators-smoke.mjs
      - name: Run Claude Step 3 planning checks
        run: node qa/claude-step3-planning-smoke.mjs
      - name: Run Claude Step 4 weather checks
        run: node qa/claude-step4-weather-smoke.mjs
      - name: Run Claude Step 5 Learn and Daily checks
        run: node qa/claude-step5-learn-daily-smoke.mjs
      - name: Run Claude Step 6 account pricing and states checks
        run: node qa/claude-step6-account-pricing-states-smoke.mjs
      - name: Audit every built page surface
        run: node qa/page-surface-smoke.mjs
      - name: Run five-pass copy and design audit
        run: node qa/five-pass-site-audit.mjs
      - name: Run second-round five-iteration deep audit
        run: node qa/five-iteration-deep-audit.mjs
      - name: Check homepage card visibility and icons
        run: node scripts/check-home-card-regression.js
      - name: Run tool-first optimization checks
        run: node qa/tool-first-smoke.mjs
      - name: Run calculator directory checks
        run: node qa/tools-directory-smoke.mjs
      - name: Run preview consolidation checks
        run: node qa/preview-consolidation-smoke.mjs
      - name: Run deployment discipline checks
        run: node qa/deployment-discipline.mjs
      - name: Run performance budget checks
        run: node qa/performance-budget.mjs
      - name: Run sticky app release checks
        run: node qa/sticky-app-smoke.mjs
      - name: Run offline calculator cache checks
        run: node qa/offline-cache-smoke.mjs
      - name: Run account system checks
        run: node qa/account-system-smoke.mjs
      - name: Run billing readiness checks
        run: node qa/billing-smoke.mjs
      - name: Run Daily retention checks
        run: node qa/daily-retention-smoke.mjs
      - name: Run Pilot Skill Gap checks
        run: node qa/skill-gap-smoke.mjs
      - name: Run Written Prep checks
        run: node qa/written-prep-smoke.mjs
      - name: Run training system checks
        run: node qa/training-system-smoke.mjs
      - name: Run CFI toolkit checks
        run: node qa/cfi-toolkit-smoke.mjs
      - name: Run flight workspace checks
        run: node qa/flight-workspace-smoke.mjs
      - name: Run connected flight-planning checks
        run: node qa/flight-journey-smoke.mjs
      - name: Run Aircraft Profiles 2.0 checks
        run: node qa/aircraft-profiles-smoke.mjs
      - name: Run Saved Flights 2.0 checks
        run: node qa/saved-flights-smoke.mjs
      - name: Run Weather Workflow 2.0 checks
        run: node qa/weather-workflow-smoke.mjs
      - name: Run PilotDesk v2 master checks
        run: node qa/v2-smoke.mjs
      - name: Run planner lab checks
        run: node qa/planner-lab-tests.mjs
      - name: Run calculator formula regression tests
        run: node qa/formula-tests.mjs
      - name: Run core calculator UX checks
        run: node qa/core-calculator-ux-smoke.mjs
      - name: Run site integrity checks
        run: node qa/site-integrity.mjs
      - name: Run trust and safety checks
        run: node qa/trust-safety-smoke.mjs
      - name: Check public copy tone
        run: node qa/copy-tone.mjs
      - name: Guard hand-written aviation copy
        run: node qa/human-copy-smoke.mjs
      - name: Run technical editorial review
        run: node qa/technical-editorial-smoke.mjs
      - name: Check Google audit regressions
        run: node qa/google-audit.mjs
      - name: Run multi-engine SEO checks
        run: node qa/multi-engine-seo.mjs
      - name: Run SEO hardening checks
        run: node qa/seo-hardening.mjs
      - name: Run full-site SEO audit
        run: node qa/full-site-seo-audit.mjs
      - name: Run SEO growth cluster checks
        run: node qa/seo-growth-cluster.mjs
      - name: Run internal SEO architecture checks
        run: node qa/internal-seo-architecture-smoke.mjs
      - name: Run Search Console CTR checks
        run: node qa/search-ctr-smoke.mjs
      - name: Run growth + retention checks
        run: node qa/growth-retention-smoke.mjs
      - name: Run organic sharing checks
        run: node qa/organic-sharing-smoke.mjs
      - name: Run final product audit
        run: node qa/final-product-audit.mjs
      - name: Run first-run experience checks
        run: node qa/first-run-experience-smoke.mjs
      - name: Run Global Search 2.0 checks
        run: node qa/global-search-smoke.mjs
