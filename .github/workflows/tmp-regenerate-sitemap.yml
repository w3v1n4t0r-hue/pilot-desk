name: Temporary regenerate post-merge sitemap

on:
  push:
    branches: [growth-search-intent-2026-09-18]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth-search-intent-2026-09-18
          fetch-depth: 0
      - name: Generate sitemap from real branch history
        run: node scripts/generate-sitemap.mjs
      - name: Commit generated sitemap
        run: |
          if git diff --quiet; then
            echo "Sitemap already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "Regenerate canonical sitemap after growth merge"
          git push origin HEAD:growth-search-intent-2026-09-18
