name: PilotDesk Copy Audit

on:
  push:
    branches: [copy-cleanup]
    paths:
      - '.github/RUN_COPY_AUDIT'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply plain-language copy pass
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/clean-copy.mjs')
          s=p.read_text()
          s=s.replace("['48 aviation calculators in one place.','48 aviation calculators.'],","['aviation calculators in one place.','aviation calculators.'],")
          s=s.replace("    ['Saved Flights','Flights','Open flights saved in this browser.','/flights.html'],\n","")
          a=s.index("edit('qa/planner-lab-tests.mjs'")
          b=s.index("edit('.github/workflows/workspace-live.yml'",a)
          s=s[:a]+s[b:]
          p.write_text(s)
          PY
          node scripts/clean-copy.mjs
      - name: Regenerate calculator pages
        run: |
          node scripts/generate-calculator-pages.mjs
          node scripts/postprocess-site.mjs
          node scripts/clean-copy-extra.mjs
      - name: Check JavaScript syntax
        run: |
          find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run full QA
        run: |
          node qa/smoke.mjs
          node qa/qol-smoke.mjs
          node qa/product-polish-smoke.mjs
          node qa/v2-smoke.mjs
          node qa/planner-lab-tests.mjs
          node qa/formula-tests.mjs
          node qa/site-integrity.mjs
          node qa/copy-tone.mjs
      - name: Commit cleanup
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Cleanup already current."
          else
            git commit -m "Clean up public copy and QA"
            git push
          fi
