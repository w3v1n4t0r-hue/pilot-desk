name: PilotDesk Production Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: pilotdesk-production-watch
  cancel-in-progress: true

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check critical production URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://www.pilot-desk.com/"
            "https://www.pilot-desk.com/tools.html"
            "https://www.pilot-desk.com/weather.html"
            "https://www.pilot-desk.com/daily/"
            "https://www.pilot-desk.com/written-prep.html"
            "https://www.pilot-desk.com/account.html"
            "https://www.pilot-desk.com/robots.txt"
            "https://www.pilot-desk.com/sitemap-index.xml"
            "https://www.pilot-desk.com/c731d63e44f2d52fcd122041601cfb22.txt"
          )
          failed=0
          for url in "${urls[@]}"; do
            code=$(curl -L -sS -o /tmp/pd-watch-body -w '%{http_code}'               --connect-timeout 10 --max-time 30               --retry 3 --retry-delay 3 --retry-all-errors "$url" || echo "000")
            echo "$code $url"
            if [ "$code" != "200" ] || [ ! -s /tmp/pd-watch-body ]; then
              failed=1
            fi
          done
          test "$failed" = "0"

      - name: Open or update production-health issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[automation] PilotDesk production health failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            const body = `Production health checks failed. Review the workflow run: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close production-health issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[automation] PilotDesk production health failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Automated production checks are passing again. Closing this incident.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
