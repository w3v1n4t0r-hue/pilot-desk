name: Temporary sync editorial sitemap

on:
  push:
    branches: [aerospace-editorial-2026-09-18]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aerospace-editorial-2026-09-18
          fetch-depth: 0
      - run: node scripts/generate-sitemap.mjs
      - name: Commit sitemap
        run: |
          if git diff --quiet sitemap.xml robots.txt; then
            echo "Sitemap already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "Sync sitemap after technical editorial rewrite"
          git push origin HEAD:aerospace-editorial-2026-09-18
