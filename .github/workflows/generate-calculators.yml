name: Verify generated calculator and guide pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-calculator-pages.mjs'
      - 'scripts/strengthen-guides.mjs'
      - 'scripts/clean-guide-boilerplate.mjs'
      - 'scripts/normalize-guide-schema.mjs'
      - 'scripts/normalize-public-copy.mjs'
      - 'scripts/postprocess-site.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'assets/calculator-config.js'
      - 'calculators/**'
      - 'guides/**'
      - 'training/**'
      - 'flight-training.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - '.github/workflows/generate-calculators.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate-calculator-pages.mjs'
      - 'scripts/strengthen-guides.mjs'
      - 'scripts/clean-guide-boilerplate.mjs'
      - 'scripts/normalize-guide-schema.mjs'
      - 'scripts/normalize-public-copy.mjs'
      - 'scripts/postprocess-site.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'assets/calculator-config.js'
      - 'calculators/**'
      - 'guides/**'
      - 'training/**'
      - 'flight-training.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - '.github/workflows/generate-calculators.yml'

permissions:
  contents: read

concurrency:
  group: pilotdesk-generated-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate static calculator pages
        run: node scripts/generate-calculator-pages.mjs
      - name: Apply static branding and aviation FAQ content
        run: node scripts/postprocess-site.mjs
      - name: Deepen guides and core tool pages
        run: node scripts/strengthen-guides.mjs
      - name: Normalize guide organization schema
        run: node scripts/normalize-guide-schema.mjs
      - name: Normalize generated public copy
        run: node scripts/normalize-public-copy.mjs
      - name: Restore hand-edited aviation pages
        shell: bash
        run: |
          git restore --source=HEAD -- \
            calculators/glide-range/index.html \
            calculators/crosswind/index.html \
            calculators/density-altitude/index.html \
            calculators/pivotal-altitude/index.html \
            calculators/three-degree-descent/index.html \
            flight-training.html \
            guides/glide-range.html \
            guides/how-far-can-an-airplane-glide.html \
            guides/best-glide-speed-vs-glide-ratio.html \
            guides/emergency-glide-planning.html \
            guides/crosswind-component.html \
            guides/density-altitude.html \
            guides/pivotal-altitude.html \
            guides/three-degree-descent.html \
            guides/checkride-study-guides.html \
            guides/pilot-checkride-math.html \
            guides/multiengine-checkride-study-guide.html \
            guides/critical-engine-multiengine.html \
            guides/multiengine-vmc-factors.html \
            guides/vmc-vs-vyse.html \
            guides/accelerate-stop-accelerate-go.html \
            guides/feathering-vs-windmilling-propeller.html \
            guides/identify-verify-feather.html \
            guides/past-critical-engine.html \
            guides/single-engine-climb-performance.html \
            guides/single-engine-service-ceiling.html \
            guides/vmc-demonstration-explained.html \
            guides/zero-sideslip-multiengine.html \
            guides/avgas-weight-per-gallon.html \
            guides/cessna-172-glide-distance.html \
            guides/crosswind-component-chart.html \
            guides/seminole-vmc-study.html \
            guides/three-degree-descent-rate-chart.html
      - name: Remove generic guide boilerplate
        run: node scripts/clean-guide-boilerplate.mjs
      - name: Generate canonical sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Verify generated output is already committed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated calculator, guide, and sitemap output is current."
          else
            echo "Generated output is stale. Run the generators on the release branch and commit the results before merging."
            git --no-pager diff --stat
            git --no-pager diff -- . ':(exclude)sitemap.xml' | head -n 300 || true
            git --no-pager diff -- sitemap.xml | head -n 220 || true
            exit 1
          fi
      - name: Check JavaScript syntax
        run: |
          find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run calculator formula regression tests
        run: node qa/formula-tests.mjs
      - name: Run site integrity checks
        run: node qa/site-integrity.mjs
      - name: Check Google audit regressions
        run: node qa/google-audit.mjs
      - name: Run SEO hardening checks
        run: node qa/seo-hardening.mjs
