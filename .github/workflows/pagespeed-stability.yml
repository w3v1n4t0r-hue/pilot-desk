name: PilotDesk PageSpeed Stability

on:
  push:
    branches: [charset-live-debug]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charset-live-debug
      - name: Apply PageSpeed stability patch
        run: python scripts/apply-pagespeed-stability.py
      - name: Check JavaScript syntax
        run: find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run full QA
        run: |
          node qa/smoke.mjs
          node qa/qol-smoke.mjs
          node qa/product-polish-smoke.mjs
          node qa/v2-smoke.mjs
          node qa/planner-lab-tests.mjs
          node qa/formula-tests.mjs
          node qa/site-integrity.mjs
          node qa/copy-tone.mjs
          node qa/google-audit.mjs
      - name: Commit tested site changes
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add assets/site.js qa/google-audit.mjs
          git commit -m "Delay service worker during initial PageSpeed audit"
          git push origin HEAD:charset-live-debug
