name: PilotDesk Live E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test deployed PilotDesk app
        env:
          PILOTDESK_BASE_URL: https://www.pilot-desk.com
        run: node qa/live-e2e.mjs
