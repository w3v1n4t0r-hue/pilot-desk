name: Competitive copy browser checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/index.astro'
      - 'src/components/ScrollFlightPath.astro'
      - 'assets/scrollcraft/**'
      - 'qa/scrollcraft-home-browser.mjs'
      - 'src/data/site.mjs'
      - 'flight-training.html'
      - 'assets/home-desk.js'
      - 'assets/training-progress.css'
      - 'assets/features.js'
      - 'assets/learn-shell.js'
      - 'assets/learn-2026.css'
      - 'assets/pilotdesk-navigation-2026.css'
      - 'about.html'
      - 'aircraft.html'
      - 'flights.html'
      - 'assets/aircraft-v2.js'
      - 'assets/flights.js'
      - 'assets/global-nav.js'
      - 'for-flight-schools.html'
      - 'for-cfis.html'
      - 'embed.html'
      - 'weather.html'
      - 'src/components/HomePlans.astro'
      - 'assets/home-desk.css'
      - 'assets/route-planner.*'
      - 'route-planner.html'
      - 'pricing.html'
      - 'written-prep.html'
      - 'learn/checkride-lab/index.html'
      - 'qa/competitive-copy-browser.mjs'
      - '.github/workflows/competitive-copy.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check desktop and mobile tasks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/pilotdesk-preview.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          node qa/competitive-copy-browser.mjs
          node qa/scrollcraft-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitive-copy-browser
          path: qa-artifacts/competitive-copy
