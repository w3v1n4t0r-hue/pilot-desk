name: PilotDesk Guide Schema SEO Pass

on:
  push:
    branches: [seo-guide-schema-pass]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-guide-schema-pass
      - name: Apply guide schema pass
        run: python scripts/apply-guide-schema-pass.py
      - name: Validate guide Article images
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const name of fs.readdirSync('guides').filter(x=>x.endsWith('.html'))){
            const p=`guides/${name}`,h=fs.readFileSync(p,'utf8');
            if(!h.includes('data-pd-guide-schema')) throw new Error(`${p}: missing guide schema`);
            if(!h.includes('"image":"https://www.pilot-desk.com/assets/aviation-guide-reference.svg"') && !h.includes('"image":"https://www.pilot-desk.com/assets/pilot-math-reference.svg"')) throw new Error(`${p}: missing Article image`);
          }
          console.log('Guide Article images PASS');
          NODE
      - name: Check JavaScript syntax
        run: find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run full QA
        run: |
          node qa/smoke.mjs
          node qa/qol-smoke.mjs
          node qa/product-polish-smoke.mjs
          node qa/v2-smoke.mjs
          node qa/planner-lab-tests.mjs
          node qa/formula-tests.mjs
          node qa/site-integrity.mjs
          node qa/copy-tone.mjs
          node qa/google-audit.mjs
          node qa/seo-hardening.mjs
      - name: Commit tested output
        run: |
          git config user.name "PilotDesk Automation"
          git config user.email "w3v1n4t0r@gmail.com"
          git add guides procedures.html assets/aviation-guide-reference.svg
          if git diff --cached --quiet; then
            echo "Guide SEO output already current."
          else
            git commit -m "Complete Article image and guide snippet SEO"
            git push origin HEAD:seo-guide-schema-pass
          fi
