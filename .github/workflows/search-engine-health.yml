name: Search Engine Health

on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'
  push:
    branches: [main]
    paths:
      - 'robots.txt'
      - 'sitemap*.xml'
      - 'scripts/search-engine-health.py'
      - 'scripts/submit-indexnow.py'
      - '.github/workflows/search-engine-health.yml'
      - '.github/workflows/indexnow-submit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify search-engine discovery
        shell: bash
        run: |
          attempts=1
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then attempts=10; fi
          for i in $(seq 1 "$attempts"); do
            echo "Search-engine health attempt $i/$attempts"
            if python scripts/search-engine-health.py; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Production may still be deploying; retrying in 30 seconds."
              sleep 30
            fi
          done
          exit 1
