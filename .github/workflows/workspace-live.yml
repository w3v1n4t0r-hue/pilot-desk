name: PilotDesk Workspace Live

on:
  push:
    branches: [main]
    paths:
      - 'api/airport-search.js'
      - 'api/nearby-airports.js'
      - 'api/weather.js'
      - 'assets/airport.js'
      - 'assets/flights.js'
      - 'assets/flight-brief.js'
      - 'assets/route-save.js'
      - 'assets/product-nav.js'
      - 'assets/hub.css'
      - 'assets/weather-extra.js'
      - 'assets/metar-decoder.js'
      - 'assets/aircraft-v2.js'
      - 'assets/site.js'
      - 'assets/app-bootstrap.js'
      - 'airport.html'
      - 'flights.html'
      - 'flight-brief.html'
      - 'planner.html'
      - 'route-planner.html'
      - 'weather.html'
      - 'aircraft.html'
      - 'metar-decoder.html'
      - 'guides/**'
      - 'site.webmanifest'
      - 'sw.js'
      - 'sitemap.xml'
      - 'sitemap-core.xml'
      - '.github/workflows/workspace-live.yml'
  workflow_dispatch:

jobs:
  verify-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and manifest checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/site.js
          node --check assets/product-nav.js
          node --check assets/app-bootstrap.js
          node --check assets/airport.js
          node --check assets/flights.js
          node --check assets/flight-brief.js
          node --check assets/route-save.js
          node --check assets/weather-extra.js
          node --check assets/metar-decoder.js
          node --check assets/aircraft-v2.js
          node --check api/airport-search.js
          node --check api/nearby-airports.js
          node --check api/weather.js
          node -e "JSON.parse(require('fs').readFileSync('site.webmanifest','utf8')); console.log('manifest JSON PASS')"
          if grep -q '<sitemapindex' sitemap.xml; then
            test -f sitemap-core.xml
            SITE_MAP=sitemap-core.xml
          else
            SITE_MAP=sitemap.xml
          fi
          grep -q 'airport.html' "$SITE_MAP"
          grep -q 'flight-training.html' "$SITE_MAP"
          grep -q 'noindex,follow' flight-brief.html
          grep -q 'noindex,follow' flights.html
          ! grep -q 'flight-brief.html</loc>' "$SITE_MAP"
          ! grep -q 'flights.html</loc>' "$SITE_MAP"
          grep -q 'pilotdesk-v21' sw.js
          echo 'LOCAL WORKSPACE CHECKS PASS'

      - name: Verify deployed workspace and airport search
        shell: bash
        run: |
          node <<'NODE'
          const base='https://www.pilot-desk.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'PilotDesk-Workspace-Live-Test/1.0'};
          async function text(path){const r=await fetch(base+path,{headers});const body=await r.text();if(!r.ok)throw new Error(`${path} HTTP ${r.status}: ${body.slice(0,250)}`);return body}
          async function json(path){const r=await fetch(base+path,{headers});const body=await r.text();if(!r.ok)throw new Error(`${path} HTTP ${r.status}: ${body.slice(0,350)}`);try{return JSON.parse(body)}catch{throw new Error(`${path} returned non-JSON: ${body.slice(0,250)}`)}}
          let last='';
          for(let attempt=1;attempt<=40;attempt++){
            try{
              const [planner,airport,flights,brief,decoder]=await Promise.all([
                text('/planner.html?workspace_live=21'),
                text('/airport.html?workspace_live=21'),
                text('/flights.html?workspace_live=21'),
                text('/flight-brief.html?workspace_live=21'),
                text('/metar-decoder.html?workspace_live=21')
              ]);
              if(!planner.includes('<h1>Plan a flight</h1>'))throw new Error('planner marker not deployed yet');
              if(!airport.includes('<h1>Airport Search</h1>'))throw new Error('airport page marker not deployed yet');
              if(!flights.includes('SAVED ON THIS DEVICE'))throw new Error('saved flights marker not deployed yet');
              if(!brief.includes('FLIGHT BRIEF'))throw new Error('flight brief marker not deployed yet');
              if(!decoder.includes('Group-by-group explanation'))throw new Error('METAR decoder marker not deployed yet');

              const mco=await json('/api/airport-search?q=MCO&workspace_live=21');
              if(!Array.isArray(mco.results)||!mco.results.some(x=>x.id==='KMCO'))throw new Error('MCO search did not resolve/include KMCO');

              const orlando=await json('/api/airport-search?q=Orlando&workspace_live=21');
              if(!Array.isArray(orlando.results)||!orlando.results.some(x=>x.id==='KMCO'))throw new Error('Orlando name search did not include KMCO');

              const wx=await json('/api/weather?station=KMCO&workspace_live=21');
              if(!wx.metar?.rawOb||!wx.metar.rawOb.includes('KMCO'))throw new Error('KMCO live weather missing METAR');

              const nearby=await json('/api/nearby-airports?lat=28.4294&lon=-81.3089&exclude=KMCO&limit=5&workspace_live=21');
              if(!Array.isArray(nearby.results)||nearby.results.length<1)throw new Error('nearby airport/weather station lookup returned no results');

              console.log('PRODUCTION WORKSPACE PASS');
              console.log('MCO search:',mco.results.slice(0,3).map(x=>`${x.id} ${x.name||''}`).join(' | '));
              console.log('Orlando search:',orlando.results.slice(0,3).map(x=>`${x.id} ${x.name||''}`).join(' | '));
              console.log('KMCO METAR:',wx.metar.rawOb);
              console.log('Nearby:',nearby.results.slice(0,5).map(x=>`${x.id} ${Math.round(x.distanceNm)}NM`).join(' | '));
              process.exit(0);
            }catch(e){
              last=String(e?.stack||e);
              console.log(`attempt ${attempt}: ${last.split('\n')[0]}`);
            }
            await sleep(3000);
          }
          throw new Error('Production workspace verification failed: '+last);
          NODE
