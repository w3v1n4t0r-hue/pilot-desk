name: PilotDesk QA

on:
  push:
    branches: [main, pilotdesk-v2-master]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          find assets api qa scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run PilotDesk smoke checks
        run: node qa/smoke.mjs
      - name: Run QoL smoke checks
        run: node qa/qol-smoke.mjs
      - name: Run product polish checks
        run: node qa/product-polish-smoke.mjs
      - name: Run app bootstrap checks
        run: node qa/app-bootstrap-smoke.mjs
      - name: Run sticky app release checks
        run: node qa/sticky-app-smoke.mjs
      - name: Run flight workspace checks
        run: node qa/flight-workspace-smoke.mjs
      - name: Run PilotDesk v2 master checks
        run: node qa/v2-smoke.mjs
      - name: Run planner lab checks
        run: node qa/planner-lab-tests.mjs
      - name: Run calculator formula regression tests
        run: node qa/formula-tests.mjs
      - name: Run site integrity checks
        run: node qa/site-integrity.mjs
      - name: Run trust and safety checks
        run: node qa/trust-safety-smoke.mjs
      - name: Check public copy tone
        run: node qa/copy-tone.mjs
      - name: Check Google audit regressions
        run: node qa/google-audit.mjs
      - name: Run SEO hardening checks
        run: node qa/seo-hardening.mjs
